version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: admia-postgres
    environment:
      POSTGRES_USER: admia
      POSTGRES_PASSWORD: admia_secure_password
      POSTGRES_DB: admia_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admia']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: admia-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admia-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://admia:admia_secure_password@postgres:5432/admia_db
      JWT_SECRET: super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 24h
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: admia-v15-enc-key-32chars-change-me!
      DIAN_API_URL: https://vpfe.dian.gov.co/document/searchqr
      DIAN_TEST_URL: https://vpfe-humano.dian.gov.co/document/searchqr
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admia-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
